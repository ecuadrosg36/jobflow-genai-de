timezone: America/Lima
daily_top_n: 5

search:
  keywords:
    - "remote data engineer"
    - "senior data engineer"
    - "data platform engineer"
    - "analytics engineer"
  location: "Peru"
  remote: true
  sites:
    - linkedin
    - indeed
    - google
    - zip_recruiter

filters:
  min_match_score: 0.1
  must_have_any: ["airflow", "spark", "databricks", "bigquery", "redshift"]
  nice_to_have_any: ["dbt", "kafka", "iceberg", "terraform", "azure"]

llm:
  enabled: true
  # Default to Groq (Free & Fast)
  model: "${LLM_MODEL:llama-3.1-8b-instant}"
  base_url: "${LLM_BASE_URL:https://api.groq.com/openai/v1}"
  temperature: 0.1

output:
  base_dir: "output"

storage:
  sqlite_path: "data/jobflow.db"
