cv:
  name: Enmanuel Cuadros Gomez
  location: Lima, Peru
  email: enmanuel.cuadros.ai@gmail.com
  phone: "+51 935 744 582"
  website: https://enmacuadroswork.com
  social_networks:
    - network: LinkedIn
      username: ecuadrosg36
    - network: GitHub
      username: ecuadrosg36
  sections:
    summary:
      - Ingeniero de Datos/ML con 5+ años construyendo pipelines de extremo a extremo y plataformas analíticas en la nube en Google Cloud, AWS y Azure.
      - Experiencia en ingestión y procesamiento de eventos y CDR con Kafka, transformación y modelado para reporting de alto rendimiento sobre Oracle, BigQuery, Redshift y Snowflake.
      - Dominio de Python, Spark, Airflow y Composer para integración, orquestación y automatización, además de Apache Iceberg, Dataflow y dbt para flujos confiables y trazables. Enfocado en escalabilidad, rendimiento, observabilidad, control de calidad y seguridad con IAM para llevar soluciones robustas a producción.

    experience:
      - company: Independent Consultant
        position: Senior Data & AI Consultant
        start_date: 2025-10
        end_date: present
        location: Lima, Peru (Remote)
        highlights:
          - Diseño e implemento arquitecturas modernas de Data Lake y Data Warehouse en AWS y GCP para centralizar la analítica corporativa.
          - Desarrollo soluciones de IA Generativa (LLMs/RAG) para automatizar la extracción de información y asistentes virtuales inteligentes.
          - Construyo dashboards ejecutivos y operativos en Power BI y Tableau, mejorando la visibilidad de KPIs en tiempo real para la toma de decisiones.
          - Diseño pipelines de Ingeniería de Datos escalables, optimizando costos de nube y asegurando la calidad del dato.

      - company: Indra Peru
        position: Big Data Engineer
        start_date: 2024-09
        end_date: 2025-09
        location: Lima, Peru
        highlights:
          - Reduje el tiempo de ejecución de procesos ETL en un 30% migrando cargas a Databricks con Scala y Spark SQL.
          - Implementé Quality Gates automáticos con dbt y Python, deteniendo despliegues fallidos en 15 pipelines críticos.
          - Optimicé el tuning de Spark (partitioning, broadcast joins) en 30 proyectos, estabilizando los SLAs.
          - Reduje incidentes productivos en un 25% mediante orquestación avanzada en Airflow y alertas automáticas.
          - Implementé Delta Lake con controles ACID y Time Travel, mejorando la seguridad y recuperación de datos.

      - company: Vooxell Group SAC
        position: Data Engineer
        start_date: 2023-09
        end_date: 2024-09
        location: Lima, Peru
        highlights:
          - Construí pipelines E2E en GCP usando Dataflow, BigQuery y Cloud Composer para analítica en tiempo real.
          - Diseñé estrategias de particionamiento en BigQuery que redujeron costos y latencia en un 30%.
          - Consolidé 16 fuentes de datos dispersas en 4 tablas maestras normalizadas para modelos de Vertex AI.
          - Procesé ~5 millones de registros usando Spark, Presto, Hive y Redshift para soporte estratégico.

      - company: Tenmas SAC
        position: Data and ML Engineer
        start_date: 2023-10
        end_date: 2024-07
        location: Spain (Remote)
        highlights:
          - Planifiqué y ejecuté la arquitectura de Data Lake para soporte financiero y modelos predictivos.
          - Optimicé consultas en Aurora MySQL reduciendo tiempos de respuesta en 15% para reporting operativo.
          - Reduje costos de infraestructura cloud en un 50% mediante evaluación y migración a servicios gestionados.
          - Integré MongoDB para la ingesta eficiente de datos semi-estructurados de alto volumen.

      - company: Neoris Peru SAC
        position: Data Engineer
        start_date: 2023-05
        end_date: 2023-12
        location: Lima, Peru
        highlights:
          - Desarrollé pipelines de Big Data usando Scala y Python; migré procesos ETL hacia Snowflake asegurando estabilidad.
          - Gestioné clusters de Hadoop/Spark y almacenamiento en HDFS bajo metodología Scrum.

      - company: Indra Peru
        position: Database Developer
        start_date: 2022-06
        end_date: 2023-07
        location: Lima, Peru
        highlights:
          - Estabilicé 15 ETLs en Snowflake/Spark y diseñé Data Marts que mejoraron los tiempos de consulta en un 30%.
          - Automaticé flujos ETL con Python y SQL Server procesando más de 10 millones de registros mensuales.

      - company: Chain Services TI SAC
        position: Business Intelligence Consultant
        start_date: 2022-03
        end_date: 2022-06
        location: Lima, Peru
        highlights:
          - Lideré migración a AWS Glue y desarrollé ETLs automatizados con Python reduciendo tiempos en 20%.
          - Integré Databricks y Airflow para validación de calidad de datos y aceleración de insights.

      - company: ManpowerGroup Peru
        position: Business Intelligence Analyst
        start_date: 2020-11
        end_date: 2022-03
        location: Lima, Peru
        highlights:
          - Diseñé dashboards en Power BI conectados a Azure Data Lake y SQL.
          - Automaticé reportes financieros con Power Automate reduciendo tiempo operativo en un 40%.

    education:
