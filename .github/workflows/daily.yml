name: Daily JobFlow

# Manual runs only: the schedule failed every day because the repo has no CV PDF or API key secret.
# To run it, add an LLM_API_KEY secret (and LLM_BASE_URL / LLM_MODEL if not using Groq's defaults).
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python -m jobflow.run --once
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: jobflow-output
          path: output/
